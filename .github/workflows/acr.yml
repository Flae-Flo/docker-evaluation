name: Construire, analyser et publier dans ACR

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  images:
    name: Image ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            context: .
          - service: backend
            context: ./backend
    env:
      ACR_NAME: dockerevaluation
      RESOURCE_GROUP: Docker
      IMAGE: quiz-${{ matrix.service }}:${{ github.sha }}

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Mission 1 : construire l'image avec son Dockerfile.
      - name: 1 - Construire
        run: docker build -t "$IMAGE" "${{ matrix.context }}"

      # Mission 2 : bloquer la suite si Trivy trouve une faille CRITICAL.
      - name: 2 - Analyser avec Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          format: table

      # Mission 3 : se connecter a Azure uniquement apres fusion dans main.
      - name: 3 - Se connecter a Azure
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Mission 4 : publier exactement l'image qui vient d'etre analysee.
      - name: 4 - Publier dans ACR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          az acr login --name "$ACR_NAME" --resource-group "$RESOURCE_GROUP"
          REGISTRY=$(az acr show --name "$ACR_NAME" --resource-group "$RESOURCE_GROUP" --query loginServer -o tsv)
          docker tag "$IMAGE" "$REGISTRY/$IMAGE"
          docker push "$REGISTRY/$IMAGE"
