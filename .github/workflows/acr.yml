name: Construire, analyser, publier et deployer

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  images:
    name: Image ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            context: .
          - service: backend
            context: ./backend
    env:
      ACR_NAME: dockerevaluation
      RESOURCE_GROUP: Docker
      IMAGE: quiz-${{ matrix.service }}:${{ github.sha }}

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Mission 1 : construire l'image avec son Dockerfile.
      - name: 1 - Construire
        run: docker build -t "$IMAGE" "${{ matrix.context }}"

      # Mission 2 : bloquer la suite si Trivy trouve une faille CRITICAL.
      - name: 2 - Analyser avec Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          format: table

      # Mission 3 : se connecter a Azure uniquement apres fusion dans main.
      - name: 3 - Se connecter a Azure
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Mission 4 : publier exactement l'image qui vient d'etre analysee.
      - name: 4 - Publier dans ACR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          az acr login --name "$ACR_NAME" --resource-group "$RESOURCE_GROUP"
          REGISTRY=$(az acr show --name "$ACR_NAME" --resource-group "$RESOURCE_GROUP" --query loginServer -o tsv)
          docker tag "$IMAGE" "$REGISTRY/$IMAGE"
          docker push "$REGISTRY/$IMAGE"

  # Mission 5 : deployer seulement quand les DEUX images sont publiees.
  deploy:
    name: Deployer dans ACA
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deployment-aca-main
      cancel-in-progress: false
    env:
      ACR_NAME: dockerevaluation
      RESOURCE_GROUP: Docker
      FRONTEND_APP: quiz-frontend
      BACKEND_APP: quiz-backend
      ACA_ENV: quiz-env
      PULL_IDENTITY: quiz-acr-pull
    steps:
      - name: Recuperer le script de deploiement
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Se connecter a Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 5 - Creer ou mettre a jour les Container Apps
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
        run: bash scripts/deploy.sh

      - name: 6 - Verifier les revisions et les images actives
        run: |
          set -euo pipefail
          REGISTRY=$(az acr show -n "$ACR_NAME" -g "$RESOURCE_GROUP" --query loginServer -o tsv)
          for service in backend frontend; do
            if [[ "$service" == backend ]]; then APP="$BACKEND_APP"; else APP="$FRONTEND_APP"; fi
            REVISION=$(az containerapp show -n "$APP" -g "$RESOURCE_GROUP" --query properties.latestReadyRevisionName -o tsv)
            test -n "$REVISION" || { echo "$APP : aucune revision prete"; exit 1; }
            IMAGE=$(az containerapp revision show -n "$APP" -g "$RESOURCE_GROUP" --revision "$REVISION" \
              --query 'properties.template.containers[0].image' -o tsv)
            EXPECTED="$REGISTRY/quiz-$service:$GITHUB_SHA"
            if [[ "$IMAGE" != "$EXPECTED" ]]; then
              echo "$APP : la revision $REVISION ne sert pas l'image attendue $EXPECTED"
              az containerapp revision list -n "$APP" -g "$RESOURCE_GROUP" \
                --query '[].{revision:name,health:properties.healthState,state:properties.runningState}' -o table
              exit 1
            fi
            echo "$APP : revision $REVISION prete avec l'image du commit"
          done

      - name: 7 - Verifier le frontend public
        run: |
          set -euo pipefail
          FRONTEND_HOST=$(az containerapp show -n "$FRONTEND_APP" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          test -n "$FRONTEND_HOST" || { echo "Activer l'ingress du frontend"; exit 1; }
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 --max-time 15 "https://$FRONTEND_HOST/" --output /dev/null
          echo "Application accessible : https://$FRONTEND_HOST"

      - name: 8 - Verifier le backend interne via NGINX
        run: |
          set -euo pipefail
          FRONTEND_HOST=$(az containerapp show -n "$FRONTEND_APP" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          test -n "$FRONTEND_HOST"
          HEALTH=$(curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 --max-time 15 \
            "https://$FRONTEND_HOST/health")
          jq -e '.status == "ok"' <<< "$HEALTH" >/dev/null
          echo "Backend joignable via le frontend"
