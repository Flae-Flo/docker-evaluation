name: Supprimer les applications ACA

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Saisir SUPPRIMER pour retirer les deux applications Standard
        required: true
        type: string

permissions:
  id-token: write

jobs:
  destroy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deployment-aca-main
      cancel-in-progress: false
    env:
      RESOURCE_GROUP: Docker
    steps:
      - name: Verifier la confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ "$CONFIRMATION" != SUPPRIMER ]]; then
            echo "::error::Confirmation incorrecte. Saisir SUPPRIMER."
            exit 1
          fi

      - name: Se connecter a Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Supprimer les deux applications Standard
        run: |
          for APP in quiz-frontend-standard quiz-backend-standard; do
            APP_ID=$(az containerapp list -g "$RESOURCE_GROUP" --query "[?name=='$APP'].id | [0]" -o tsv)
            if [[ -n "$APP_ID" ]]; then
              az containerapp delete -n "$APP" -g "$RESOURCE_GROUP" --yes --output none
              echo "$APP supprimee."
            else
              echo "$APP deja absente."
            fi
          done
