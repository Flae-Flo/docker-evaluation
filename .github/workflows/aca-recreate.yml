name: Recreer les applications ACA

on: workflow_dispatch

permissions:
  contents: read
  id-token: write

jobs:
  recreate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deployment-aca-main
      cancel-in-progress: false
    env:
      ACR_NAME: dockerevaluation
      RESOURCE_GROUP: Docker
      FRONTEND_APP: quiz-frontend-standard
      BACKEND_APP: quiz-backend-standard
      ACA_ENV: quiz-env-standard
      PULL_IDENTITY: quiz-acr-pull
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Se connecter a Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Trouver le dernier tag commun dans ACR
        run: |
          BACKEND_TAGS=$(az acr repository show-tags -n "$ACR_NAME" --repository quiz-backend -o json)
          FRONTEND_TAGS=$(az acr repository show-tags -n "$ACR_NAME" --repository quiz-frontend --orderby time_desc -o json)
          TAG=$(jq -er --argjson backend "$BACKEND_TAGS" \
            'first(.[] | select(test("^[0-9a-f]{40}$")) | select(. as $tag | $backend | index($tag) != null))' <<< "$FRONTEND_TAGS") || {
            echo "::error::Aucun tag de commit commun aux deux images dans ACR."
            exit 1
          }
          echo "Images selectionnees : $TAG"
          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Creer ou mettre a jour les deux applications
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
        run: bash scripts/deploy.sh

      - name: Verifier les images et le routage
        run: |
          bash scripts/check-revisions.sh
          HOST=$(az containerapp show -n "$FRONTEND_APP" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          HEALTH=$(curl -fsS --retry 12 --retry-all-errors --retry-delay 5 --max-time 15 "https://$HOST/health")
          jq -e '.status == "ok"' <<< "$HEALTH" >/dev/null
          echo "Application accessible : https://$HOST"
