server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;

    # Main app
    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Admin page - serve gestion-quiz.html for /gestion-quiz route
    location = /gestion-quiz {
        try_files /gestion-quiz.html =404;
    }

    # Sur Azure, le sidecar Dapr achemine la requete vers le backend prive.
    location ~ ^/(api/|health$) {
        proxy_pass ${BACKEND_URL};
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header dapr-app-id "${BACKEND_DAPR_APP_ID}";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

}
